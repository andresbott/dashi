name: Release
on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write
  packages: write

jobs:
  # ===========================================================================
  # Linux + Windows (runs on Ubuntu, creates the GitHub release)
  # ===========================================================================
  release-linux:
    runs-on: ubuntu-22.04
    env:
      CGO_ENABLED: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go 1.25.4
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Install NPM dependencies
        working-directory: webui
        run: npm ci

      - name: Build frontend
        run: make package-ui

      # The viewer's Tailwind stylesheet is a committed build artifact, so a
      # release would still work without this step — it would just ship a
      # stale viewer.css if templates changed after the last local run.
      - name: Build viewer stylesheet
        run: make viewer-css

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert add-on version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cfg="$(grep -E '^version:' ha-addon/config.yaml | awk '{print $2}' | tr -d '"')"
          if [ "$cfg" != "$tag" ]; then
            echo "ha-addon/config.yaml version ($cfg) != release tag ($tag)"; exit 1
          fi

      - name: Stage binaries for the add-on image
        run: |
          mkdir -p ha-addon/dist/amd64 ha-addon/dist/arm64
          cp "$(find dist -type f -name dashi -path '*linux_amd64_v1*' | head -1)" ha-addon/dist/amd64/dashi
          cp "$(find dist -type f -name dashi -path '*linux_arm64*'     | head -1)" ha-addon/dist/arm64/dashi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push add-on images
        run: |
          tag="${GITHUB_REF_NAME#v}"
          build() {
            docker_arch="$1"; ha_arch="$2"
            docker buildx build \
              --platform "linux/${docker_arch}" \
              --build-arg "BUILD_FROM=ghcr.io/home-assistant/${ha_arch}-base-debian:bookworm" \
              --tag "ghcr.io/andresbott/dashi-${ha_arch}:${tag}" \
              --tag "ghcr.io/andresbott/dashi-${ha_arch}:latest" \
              --push ha-addon
          }
          build amd64 amd64
          build arm64 aarch64

  # ===========================================================================
  # macOS (runs on macOS, appends to existing release)
  # ===========================================================================
  release-darwin:
    needs: release-linux
    runs-on: macos-latest
    env:
      CGO_ENABLED: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go 1.25.4
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install NPM dependencies
        working-directory: webui
        run: npm ci

      - name: Build frontend
        run: make package-ui

      # The viewer's Tailwind stylesheet is a committed build artifact, so a
      # release would still work without this step — it would just ship a
      # stale viewer.css if templates changed after the last local run.
      - name: Build viewer stylesheet
        run: make viewer-css

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --config .goreleaser-darwin.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
