<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Name}}</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            font-family: {{if .FontFamily}}'{{.FontFamily}}', {{end}}-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: {{if .BackgroundCSS}}{{.BackgroundCSS}}{{else}}{{.Palette.BG}}{{end}};
            color: {{.Palette.FG}};
        }
        .container {
            width: 100%;
            max-width: {{.MaxWidth}};
        }
        .row {
            margin-bottom: 16px;
        }
        .row-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 8px;
            padding: 4px 0;
        }
        .row-grid {
            overflow: hidden;
            margin: auto;
        }
        .widget-cell {
            float: left;
        }
    </style>
</head>
<body>
    <div class="container">
        {{- range .Rows}}
        <div class="row"{{if .Height}} style="height: {{.Height}}"{{end}}>
            {{if .Title}}<h2 class="row-title">{{.Title}}</h2>{{end}}
            <div class="row-grid"{{if .Width}} style="width: {{.Width}}"{{end}}>
                {{range .Widgets}}
                <div class="widget-cell" style="width: {{printf "%.4f" .WidthPercent}}%; margin-left: {{printf "%.4f" .MarginLeftPercent}}%{{if .DebugColor}}; background: {{.DebugColor}}{{end}}">
                    {{.HTML}}
                </div>
                {{end}}
            </div>
        </div>
        {{- end}}
    </div>
    <!-- custom.css goes LAST in the document. litehtml collects <style>
         elements in document order and breaks equal-specificity ties by
         insertion order, and widget CSS now ships inside each widget's body.
         Anything earlier would lose to the widget's own rules. -->
    {{if .CustomCSS}}<style>{{.CustomCSS}}</style>{{end}}
</body>
</html>
