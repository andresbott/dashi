<div class="dashi-sysinfo flex flex-col gap-3">
    {{range .Disks}}
    <div class="dashi-sysinfo__item flex items-center gap-3" data-disk="{{.Mountpoint}}">
        <span class="dashi-sysinfo__icon shrink-0 text-xl leading-none text-[var(--dashi-text)]" style="font-family: '{{$.IconFontFamily}}';" aria-hidden="true">{{$.DiskIcon}}</span>
        <div class="flex min-w-0 flex-1 flex-col gap-1">
            <div class="flex items-baseline justify-between gap-2">
                <span class="dashi-sysinfo__label min-w-0 truncate text-sm font-semibold text-[var(--dashi-text)]">{{.Mountpoint}}</span>
                <span class="dashi-sysinfo__value shrink-0 text-xs text-[var(--dashi-text-muted)]">{{.FreeHuman}} free / {{.TotalHuman}}</span>
            </div>
            <div class="dashi-sysinfo__bar h-1.5 overflow-hidden rounded-full bg-[var(--dashi-text)]/70">
                <div class="dashi-sysinfo__bar-fill h-full rounded-full bg-[var(--dashi-success)]" style="width: {{printf "%.0f" .UsedPct}}%"></div>
            </div>
        </div>
    </div>
    {{end}}
    {{if .ShowMemory}}
    <div class="dashi-sysinfo__item flex items-center gap-3" data-mem>
        <span class="dashi-sysinfo__icon shrink-0 text-xl leading-none text-[var(--dashi-text)]" style="font-family: '{{.IconFontFamily}}';" aria-hidden="true">{{.MemoryIcon}}</span>
        <div class="flex min-w-0 flex-1 flex-col gap-1">
            <div class="flex items-baseline justify-between gap-2">
                <span class="dashi-sysinfo__label min-w-0 truncate text-sm font-semibold text-[var(--dashi-text)]">Memory</span>
                <span class="dashi-sysinfo__value shrink-0 text-xs text-[var(--dashi-text-muted)]">{{.MemUsedHuman}} / {{.MemTotalHuman}}</span>
            </div>
            <div class="dashi-sysinfo__bar h-1.5 overflow-hidden rounded-full bg-[var(--dashi-text)]/70">
                <div class="dashi-sysinfo__bar-fill h-full rounded-full bg-[var(--dashi-success)]" style="width: {{printf "%.0f" .MemUsedPct}}%"></div>
            </div>
        </div>
    </div>
    {{end}}
    {{if .ShowUptime}}
    <div class="dashi-sysinfo__item flex items-center gap-3" data-uptime>
        <span class="dashi-sysinfo__icon shrink-0 text-xl leading-none text-[var(--dashi-text)]" style="font-family: '{{.IconFontFamily}}';" aria-hidden="true">{{.UptimeIcon}}</span>
        <div class="flex min-w-0 flex-1 items-baseline justify-between gap-2">
            <span class="dashi-sysinfo__label min-w-0 truncate text-sm font-semibold text-[var(--dashi-text)]">Uptime</span>
            <span class="dashi-sysinfo__value shrink-0 text-xs text-[var(--dashi-text-muted)]">{{.UptimeHuman}}</span>
        </div>
    </div>
    {{end}}
</div>
