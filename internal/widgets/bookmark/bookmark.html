<style>
    .widget-bookmark .bookmark-link { text-decoration: none; color: inherit; display: block; }
    .widget-bookmark .bookmark-title { font-weight: 600; display: block; }
    .widget-bookmark .bookmark-subtitle { font-size: 0.85em; color: {{.MutedColor}}; display: block; margin-top: 2px; }
</style>
<div class="widget-bookmark">
    <a href="{{.URL}}" class="bookmark-link">
        <span class="bookmark-title">{{.Title}}</span>
        {{if .Subtitle}}<span class="bookmark-subtitle">{{.Subtitle}}</span>{{end}}
    </a>
</div>
