name: Dashi
version: "0.4.0"
slug: dashi
description: Self-hosted dashboard with configurable widgets — editor via ingress, viewer on a host port
url: https://github.com/andresbott/dashi
arch:
  - aarch64
  - amd64
image: ghcr.io/andresbott/dashi-{arch}
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:view-dashboard
ports:
  "8087/tcp": 8087
ports_description:
  "8087/tcp": Public read-only viewer (browsers and ESP32 / e-ink devices)
options:
  log_level: info
  viewer_port: 8087
  viewer_public_url: ""
  editor_public_url: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  viewer_port: port
  viewer_public_url: str?
  editor_public_url: str?
